[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "romutil"
version = "0.1.0"
description = "ROM MUD area parser and isometric map generator"
requires-python = ">=3.10"
dependencies = [
    "graphviz>=0.20",
    "networkx>=3.0",
    "ply>=3.11",
    "pydot>=3.0",
    "pyomo>=6.0",
    "spqrtree>=0.1.2",
    "svgwrite>=1.4.0",
    "tqdm>=4.60.0",
]

[project.scripts]
romutil = "romutil.cli:cli"

[tool.setuptools.packages.find]
include = ["romutil*"]

[tool.setuptools.package-data]
"romutil.templates" = ["*.html"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=romutil --cov-report=term-missing --cov-fail-under=95"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as full end-to-end integration or MILP solves",
    "regression: mark test as an invariant regression test for historical layout defects",
]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
