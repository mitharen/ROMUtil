name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends coinor-cbc

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Static type analysis (mypy)
        run: uv run mypy romutil

      - name: Architecture documentation sync check
        run: python scripts/sync_design_doc.py

  test:
    name: Test Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends coinor-cbc

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Static type analysis (mypy)
        run: uv run --python ${{ matrix.python-version }} mypy romutil

      - name: Architecture documentation sync check
        run: python scripts/sync_design_doc.py

      - name: Run test suite with coverage enforcement
        run: uv run --python ${{ matrix.python-version }} pytest --cov=romutil --cov-fail-under=95
