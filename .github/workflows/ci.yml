name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends coinor-cbc

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Static type analysis (mypy)
        run: uv run mypy romutil

  test:
    name: Test Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends coinor-cbc

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Static type analysis (mypy)
        run: uv run --python ${{ matrix.python-version }} mypy romutil

      - name: Run test suite with coverage enforcement
        run: |
          uv run --python ${{ matrix.python-version }} pytest -v --cov=romutil --cov-fail-under=95 --tb=short 2>&1 | tee test_output.log || {
            echo "### Pytest Failures (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 150 test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  docker:
    name: Docker Container Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: romutil:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test CLI help and area parsing
        run: |
          docker run --rm romutil:test --help
          docker run --rm -v "${{ github.workspace }}/tests/fixtures/areas:/data" romutil:test school.are -outbase /data/school_smoke -f json
          test -f tests/fixtures/areas/school_smoke.json
          rm -f tests/fixtures/areas/school_smoke.json
